<script>
    function toggleMode() {
        var isHours = document.getElementById('modeHours').checked;
        document.getElementById('groupTzHours').style.display = isHours ? 'block' : 'none';
        document.getElementById('groupTzPercent').style.display = isHours ? 'none' : 'block';
        calculate();
    }

    // Suchfunktion für Krankenkassen (Zeigt bei Fokus alle Einträge)
    function renderKKMenu(filterText, forceAll) {
        var menu = document.getElementById('kkDropdownMenu');
        menu.innerHTML = '';
        var search = (forceAll ? '' : (filterText || '')).toLowerCase();

        if (typeof KRANKENKASSEN === 'undefined') {
            console.error("krankenkasse.js wurde nicht geladen.");
            return;
        }

        for (var key in KRANKENKASSEN) {
            var itemData = KRANKENKASSEN[key];
            var nameMatch = itemData.name.toLowerCase().indexOf(search) !== -1;
            var tagsMatch = itemData.tags ? itemData.tags.toLowerCase().indexOf(search) !== -1 : false;

            if (!search || nameMatch || tagsMatch) {
                var div = document.createElement('div');
                div.className = 'dropdown-item';
                div.innerText = itemData.name;
                div.onclick = (function(k, name) {
                    return function() {
                        selectKK(k, name);
                    };
                })(key, itemData.name);
                menu.appendChild(div);
            }
        }
    }

    function showKKMenu() {
        // Beim Klick/Fokus immer das gesamte Menü anzeigen
        renderKKMenu('', true);
        document.getElementById('kkDropdownMenu').style.display = 'block';
    }

    function filterKKMenu() {
        // Nur filtern, wenn aktiv getippt wird
        renderKKMenu(document.getElementById('kkSearchInput').value, false);
        document.getElementById('kkDropdownMenu').style.display = 'block';
    }

    function selectKK(key, name) {
        document.getElementById('selectedKKKey').value = key;
        document.getElementById('kkSearchInput').value = name;
        document.getElementById('kkDropdownMenu').style.display = 'none';

        var isCustom = key === 'individuell';
        document.getElementById('groupCustomKK').style.display = isCustom ? 'block' : 'none';
        calculate();
    }

    // Menü schließen, wenn außerhalb geklickt wird
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.form-group')) {
            document.getElementById('kkDropdownMenu').style.display = 'none';
        }
    });

    function formatEUR(val) {
        return val.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
    }

    function calculate() {
        if (typeof calculateNettoDetails === 'undefined') {
            console.error("steuern.js konnte nicht geladen werden.");
            return;
        }

        var bruttoVz = parseFloat(document.getElementById('bruttoVz').value) || 0;
        var stundenVz = parseFloat(document.getElementById('stundenVz').value) || 1;
        var steuerklasse = document.getElementById('steuerklasse').value;
        var kirchensteuer = document.getElementById('kirchensteuer').value;
        var anzahlKinder = parseInt(document.getElementById('anzahlKinder').value) || 0;
        var bundesland = document.getElementById('bundesland').value;
        var kkKey = document.getElementById('selectedKKKey').value;
        var customZusatz = parseFloat(document.getElementById('customZusatz').value) || 1.7;

        var isHours = document.getElementById('modeHours').checked;
        var stundenTz, prozentTz;
        
        if (isHours) {
            stundenTz = parseFloat(document.getElementById('stundenTz').value) || 0;
            prozentTz = (stundenTz / stundenVz) * 100;
        } else {
            prozentTz = parseFloat(document.getElementById('prozentTz').value) || 0;
            stundenTz = (prozentTz / 100) * stundenVz;
        }

        var bruttoTz = bruttoVz * (prozentTz / 100);

        var dataVz = calculateNettoDetails(bruttoVz, steuerklasse, kirchensteuer, anzahlKinder, bundesland, kkKey, customZusatz);
        var dataTz = calculateNettoDetails(bruttoTz, steuerklasse, kirchensteuer, anzahlKinder, bundesland, kkKey, customZusatz);

        var monatsStundenVz = stundenVz * 4.33;
        var monatsStundenTz = stundenTz * 4.33;

        document.getElementById('nettoVzDisplay').innerText = formatEUR(dataVz.netto);
        document.getElementById('hourlyNetVz').innerText = formatEUR(monatsStundenVz > 0 ? dataVz.netto / monatsStundenVz : 0) + ' / Std. netto';

        document.getElementById('nettoTzDisplay').innerText = formatEUR(dataTz.netto);
        document.getElementById('hourlyNetTz').innerText = formatEUR(monatsStundenTz > 0 ? dataTz.netto / monatsStundenTz : 0) + ' / Std. netto';

        document.getElementById('diffHours').innerText = '-' + (stundenVz - stundenTz).toFixed(1) + ' h';
        document.getElementById('diffBrutto').innerText = '-' + formatEUR(bruttoVz - bruttoTz);
        document.getElementById('diffNetto').innerText = '-' + formatEUR(dataVz.netto - dataTz.netto);
        
        document.getElementById('bruttoVzDetail').innerHTML = '<strong>' + formatEUR(bruttoVz) + '</strong>';
        document.getElementById('bruttoTzDetail').innerHTML = '<strong>' + formatEUR(bruttoTz) + '</strong>';

        var ids = ['lst', 'soli', 'kst', 'rv', 'av', 'kv', 'pv'];
        ids.forEach(function(id) {
            document.getElementById(id + 'Vz').innerText = formatEUR(dataVz[id]);
            document.getElementById(id + 'Tz').innerText = formatEUR(dataTz[id]);
        });
    }

    // Standardauswahl setzen & Berechnung starten
    setTimeout(function() {
        if (typeof KRANKENKASSEN !== 'undefined' && KRANKENKASSEN['standard']) {
            document.getElementById('kkSearchInput').value = KRANKENKASSEN['standard'].name;
        }
        calculate();
    }, 100);
</script>
